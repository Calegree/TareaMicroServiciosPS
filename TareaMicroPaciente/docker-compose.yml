version: '3.8'

services:
  # Servicio de Licencias (proveedor)
  licencias:
    build: ./licencias
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - licencias_db:/app/data
    networks:
      - microservices

  # Portal Paciente (consumidor)
  portal-paciente:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - LICENSES_SERVICE_URL=http://licencias:3000
    volumes:
      - portal_db:/app/data
    depends_on:
      - licencias
    networks:
      - microservices

  # Validador Aseguradora (consumidor)
  validador-aseguradora:
    build: ./validador-aseguradora
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - LICENSES_SERVICE_URL=http://licencias:3000
    volumes:
      - validador_db:/app/data
    depends_on:
      - licencias
    networks:
      - microservices

  # Tests de consumidor (Pact)
  consumer-tests:
    build: .
    command: npm run test:pact
    environment:
      - LICENSES_SERVICE_URL=http://licencias:3000
    volumes:
      - ./pacts:/app/pacts
      - ./logs:/app/logs
    depends_on:
      - licencias
    networks:
      - microservices

  # Verificación del proveedor
  verify-licencias:
    build: ./licencias
    command: npm run test:pact:verify
    environment:
      - PACT_BROKER_URL=http://pact-broker:9292
    volumes:
      - ./pacts:/app/pacts
    depends_on:
      - licencias
    networks:
      - microservices

volumes:
  licencias_db:
  portal_db:
  validador_db:

networks:
  microservices:
    driver: bridge
